name: Mirket harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify and expose the published harness
        run: |
          MIRKET_RELEASE="mirket-v$(node -p "require('./.mirket/release.json').version")"
          MIRKET_SHA256="$(node -p "require('./.mirket/release.json').assets.find(a => a.target === 'x86_64-unknown-linux-gnu').sha256")"
          mkdir -p "$RUNNER_TEMP/mirket-runtime/bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/codemirket/harness/releases/download/$MIRKET_RELEASE/mirket-x86_64-unknown-linux-gnu" \
            --output "$RUNNER_TEMP/mirket-runtime/bin/mirket"
          printf '%s  %s\n' "$MIRKET_SHA256" "$RUNNER_TEMP/mirket-runtime/bin/mirket" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/mirket-runtime/bin/mirket"
          echo "$RUNNER_TEMP/mirket-runtime/bin" >> "$GITHUB_PATH"
      - name: Check committed adoption and failure probes
        run: npm run agents:check
